# Recipe: Hash-collision simulation
# Category: identity
# Tests: a dedup consumer that truncates content hashes must not treat a shared prefix as a true duplicate.
# Expected consumer response: diverges — the two recorded hashes share an 8-char prefix but differ at full length, so a truncated-hash dedup would wrongly collide them.
# Requires: none
# Note: this is an ORACLE-RECORDED prefix collision. The manifest records a content
# hash whose first collision_prefix_len hex chars match the referent's; the on-disk
# file's real sha256 does NOT share the prefix. It exercises consumers that dedup on
# the recorded/manifest hash, not consumers that re-hash files on disk. A true
# on-disk sha256 prefix collision (nonce grind) is tracked as a follow-up.
