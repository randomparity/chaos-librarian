# Recipe: Cross-root move
# Category: identity
# Tests: durable identity must survive moving an asset between library roots.
# Expected consumer response: converges — same identity under the new root.
# Requires: none
schema_version: 27
scenario_id: recipe-identity-cross-root-move
seed: 1202
duration_scale: short
library:
  roots:
    - id: movies_sd
      path: movies-sd
    - id: movies_hd
      path: movies-hd
movies:
  - id: w_cross
    title: Cross Root Move
    layout: movie_flat
    variants:
      - id: v_cross
        label: hd
        bundle:
          id: b_cross
          assets:
            - id: asset_cross
              role: main
              container: mkv
              duration_seconds: 2.0
              video:
                source: color_bars
                codec: h264
                resolution: hd
              audio:
                - source: sine
                  codec: aac
                  channels: stereo
                  language: eng
series: []
artists: []
timeline:
  - id: ev_cross
    at: 1s
    action: move_between_roots
    target: asset_cross
    from_root_id: movies_sd
    to_root_id: movies_hd
