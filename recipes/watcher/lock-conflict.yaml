# Recipe: Advisory lock conflict
# Category: watcher
# Tests: an exclusive advisory lock is held on an asset for a window (EAGAIN/EBUSY),
#   then released.
# Expected consumer response: a writer that hits the lock retries or backs off
#   rather than failing the asset outright, and proceeds once the lock is released.
# Requires: network-fs-chaos
schema_version: 30
scenario_id: recipe-watcher-lock-conflict
seed: 5112
duration_scale: short
profiles:
  - network-fs-chaos
library:
  roots:
    - id: main
      path: movies
movies:
  - id: w_lock
    title: Lock Conflict
    layout: movie_flat
    variants:
      - id: v_lock
        label: hd
        bundle:
          id: b_lock
          assets:
            - id: asset_lock
              role: main
              container: mkv
              duration_seconds: 2.0
              video:
                source: color_bars
                codec: h264
                resolution: hd
              audio:
                - source: sine
                  codec: aac
                  channels: stereo
                  language: eng
series: []
artists: []
timeline:
  - id: ev_acquire
    at: 1s
    action: acquire_lock
    target: asset_lock
    lock_type: exclusive
  - id: ev_release
    at: 5s
    action: release_lock
    for: ev_acquire
