# Recipe: Permission denied mid-scan
# Category: watcher
# Tests: a file's permissions flip to 000 partway through a scan window (EACCES).
# Expected consumer response: surfaces the EACCES without crashing, and recovers
#   when the permissions are restored; does not drop the asset from its index on a
#   transient permission error.
# Requires: network-fs-chaos
schema_version: 32
scenario_id: recipe-watcher-permission-denied-midscan
seed: 5111
duration_scale: short
profiles:
  - network-fs-chaos
library:
  roots:
    - id: main
      path: movies
movies:
  - id: w_perm
    title: Permission Denied
    layout: movie_flat
    variants:
      - id: v_perm
        label: hd
        bundle:
          id: b_perm
          assets:
            - id: asset_perm
              role: main
              container: mkv
              duration_seconds: 2.0
              video:
                source: color_bars
                codec: h264
                resolution: hd
              audio:
                - source: sine
                  codec: aac
                  channels: stereo
                  language: eng
series: []
artists: []
timeline:
  - id: ev_chmod
    at: 1s
    action: change_permissions
    target: asset_perm
    mode: "000"
