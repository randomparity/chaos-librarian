# Recipe: Symlink (in-root)
# Category: scanner
# Tests: one path is an os.symlink to another in-library asset's file — a scanner must decide whether to FOLLOW the link (and dedup it against the target by realpath) or REJECT/skip it, never double-counting it as an independent file.
# Expected consumer response: converges — a scanner that resolves the link by realpath treats the two paths as one underlying file; one that double-counts the link as a separate asset diverges. (Expected response is documentation; chaos-librarian records only the neutral on-disk fact that the path is a symlink and where it points.)
# Note: this ships the in-root form (symlink.to_asset). The library-escaping form (symlink.to_run_dir_path), the "symlink-external" shape, validates clean but materializes end-to-end only with an out-of-library target the run does not yet author; that target-authoring / dangling work is deferred (see the issue #179 follow-up).
# Requires: none
schema_version: 31
scenario_id: recipe-scanner-symlink-external
seed: 2179
duration_scale: short
library:
  roots:
    - id: movies_hd
      path: movies-hd
movies:
  - id: w_link
    title: Symlinked Asset
    layout: movie_flat
    variants:
      - id: v_original
        label: original
        bundle:
          id: b_original
          assets:
            - id: asset_original
              role: main
              container: mkv
              duration_seconds: 2.0
              video:
                source: color_bars
                codec: h264
                resolution: hd
              audio:
                - source: sine
                  codec: aac
                  channels: stereo
                  language: eng
      - id: v_symlink
        label: symlink
        bundle:
          id: b_symlink
          assets:
            - id: asset_symlink
              role: main
              container: mkv
              duration_seconds: 2.0
              video:
                source: color_bars
                codec: h264
                resolution: hd
              audio:
                - source: sine
                  codec: aac
                  channels: stereo
                  language: eng
              symlink:
                to_asset: asset_original
series: []
artists: []
timeline: []
