schema_version: 31
scenario_id: slow-copy-materialize
seed: 7
duration_scale: short

library:
  roots:
    - id: staging
      path: staging
    - id: movies_hd
      path: movies-hd

movies:
  - id: movie_nova
    title: Synthetic Nova
    layout: movie_flat
    variants:
      - id: variant_hd
        label: hd
        bundle:
          id: bundle_hd
          assets:
            - id: asset_main
              role: primary_video
              container: mkv
              duration_seconds: 6
              video:
                source: mandelbrot
                codec: h264
                resolution: hd
              audio:
                - codec: aac
                  channels: stereo
                  language: eng

series: []
artists: []
timeline:
  - id: copy_start_001
    at: 1s
    action: slow_copy_start
    target: asset_main
    to: movies-hd/Nova.mkv
    temp_path: movies-hd/Nova.mkv.part
    duration: 3s
  - id: copy_commit_001
    at: 4s
    action: slow_copy_commit
    for: copy_start_001
