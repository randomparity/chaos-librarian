schema_version: 8
scenario_id: bundle-sidecars
seed: 99
duration_scale: short

library:
  roots:
    - id: movies_hd
      path: movies-hd

works:
  - id: work_quasar
    title: Synthetic Quasar
    variants:
      - id: variant_hd
        label: hd
        bundle:
          id: bundle_hd
          assets:
            - id: asset_main
              role: primary_video
              container: mkv
              duration_seconds: 8
              video:
                source: mandelbrot
                codec: h264
                resolution: 1080p
              audio:
                - codec: aac
                  channels: stereo
                  language: eng
              subtitles:
                - codec: srt
                  language: eng
                  mode: sidecar

timeline:
  - id: ev_create_poster
    at: 0s
    action: create_sidecar
    target: asset_main
    to: movies-hd/Quasar.poster.png
    kind: poster
  - id: ev_create_nfo
    at: 0s
    action: create_sidecar
    target: asset_main
    to: movies-hd/Quasar.nfo
    kind: nfo
  - id: ev_embed_subtitle
    at: 1s
    action: embed_subtitle
    target: asset_main
    sidecar_path: asset_main.eng.srt
  - id: ev_rename_asset
    at: 2s
    action: rename_file
    target: asset_main
    to: movies-hd/Quasar.HD.mkv
