              role: primary_video
              container: mkv
              duration_seconds: 4
              video:
                source: mandelbrot
                codec: h264
                resolution: hd
              audio:
                - codec: aac
                  channels: stereo
                  language: eng
              subtitles:
                - codec: srt
                  language: eng
                  mode: sidecar

timeline:
