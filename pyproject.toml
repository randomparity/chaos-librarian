[project]
name = "chaos-librarian"
version = "0.0.0"
description = "Scenario-driven synthetic media library simulator for voom-v2 tests."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "David Christensen" }]
dependencies = [
    "pydantic>=2.10",
    "typer>=0.13",
    "ruamel.yaml>=0.18",
]

[project.scripts]
chaos-librarian = "chaos_librarian.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7",
    "ty",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["chaos_librarian"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "TID",          # tidy imports
    "PL",           # pylint
    "PT",           # pytest style
]
ignore = [
    "PLR0913",      # too many args — Pydantic models exceed this naturally
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]   # magic numbers fine in tests

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"   # absolute imports only — matches global standards

[tool.ruff.format]
quote-style = "double"

[tool.ty.rules]
unresolved-import = "error"
possibly-unresolved-reference = "error"
