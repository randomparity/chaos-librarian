[project]
name = "chaos-librarian"
version = "0.0.0"
description = "Scenario-driven synthetic media library simulator for voom-v2 tests."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "David Christensen" }]
dependencies = [
    "pydantic>=2.10",
    "typer>=0.13",
    "ruamel.yaml>=0.18",
]

[project.scripts]
chaos-librarian = "chaos_librarian.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7",
    "ty",
]

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["chaos_librarian"]
branch = true
